[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tongling"
version = "0.7.6"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic>=2.9,<3", "python-multipart>=0.0.18", "httpx>=0.27,<1", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "openpyxl>=3.1,<4", "pymupdf>=1.24,<2", "numpy>=1.26,<3", "faiss-cpu>=1.9", "rank-bm25>=0.2.2", "pillow>=13.0.0", "tzdata>=2025", "pytest>=8,<10"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
